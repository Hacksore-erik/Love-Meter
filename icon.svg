<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Love Meter">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff5e7d"/>
      <stop offset="100%" stop-color="#ff2d55"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffe5ec"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Фон -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>

  <!-- Мягкое свечение под сердцем -->
  <circle cx="256" cy="256" r="140" fill="#ffffff" opacity="0.08"/>

  <!-- Сердце -->
  <path d="M256 440
           C 90 320, 40 210, 40 150
           C 40 80, 100 40, 160 40
           C 205 40, 240 80, 256 120
           C 272 80, 307 40, 352 40
           C 412 40, 472 80, 472 150
           C 472 210, 422 320, 256 440 Z"
        fill="url(#heartGrad)"
        filter="url(#glow)"/>

  <!-- Блик сверху -->
  <ellipse cx="160" cy="110" rx="38" ry="22"
           fill="#ffffff" opacity="0.35"
           transform="rotate(-25 160 110)"/>
</svg>